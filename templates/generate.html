<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="schedule-page">
      <a href="{{ url_for('index') }}">← Back to calendar</a>
      <h1>{{ title }}</h1>
      <form method="post" class="schedule-generator">
        {% if error %}<p class="generation-error" role="alert">{{ error }}</p>{% endif %}
        <textarea id="content" name="content" dir="rtl">{{ content }}</textarea>
        <button type="submit">Generate</button>
      </form>
    </main>
  </body>
</html>
